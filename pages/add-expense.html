<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Gastos is a frontend-only expense tracker for Filipino college students.">
  <title>Add expense | Gastos</title>
  <link rel="icon" href="../assets/images/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body data-page="add">
  <a class="skip-link" href="#main">Skip to main content</a>
  <nav class="navbar navbar-expand-md g-navbar" aria-label="Main navigation">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="../index.html">
        <img src="../assets/images/logo.svg" width="32" height="32" alt=""> Gastos
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
              aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto gap-md-1">
<li class="nav-item"><a class="nav-link" href="../index.html">Dashboard</a></li>
<li class="nav-item"><a class="nav-link" href="../pages/transactions.html">Transactions</a></li>
<li class="nav-item"><a class="nav-link active" href="../pages/add-expense.html" aria-current="page">Add expense</a></li>
<li class="nav-item"><a class="nav-link" href="../pages/budget.html">Budget</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main id="main" class="container py-4">
    <div class="row justify-content-center">
      <div class="col-lg-7">
        <h1 class="h2 mb-1">Add expense</h1>
        <p class="text-muted">Fields marked with * are required.</p>
        <form id="expenseForm" class="g-card" novalidate>
          <div class="mb-3"><label for="description" class="form-label">Description *</label>
            <input type="text" id="description" class="form-control" maxlength="80" autocomplete="off"
                   aria-describedby="descriptionFeedback" placeholder="e.g. Lunch at canteen">
            <div id="descriptionFeedback" class="invalid-feedback"></div></div>
          <div class="row">
            <div class="col-sm-6 mb-3"><label for="amount" class="form-label">Amount (₱) *</label>
              <input type="number" id="amount" class="form-control" step="0.01" inputmode="decimal"
                     aria-describedby="amountFeedback" placeholder="0.00">
              <div id="amountFeedback" class="invalid-feedback"></div></div>
            <div class="col-sm-6 mb-3"><label for="date" class="form-label">Date *</label>
              <input type="date" id="date" class="form-control" aria-describedby="dateFeedback">
              <div id="dateFeedback" class="invalid-feedback"></div></div>
          </div>
          <div class="mb-3"><label for="category" class="form-label">Category *</label>
            <select id="category" class="form-select" aria-describedby="categoryFeedback">
              <option value="">Choose a category</option>
              <option value="Food">Food</option><option value="Transport">Transport</option>
            <option value="School">School Supplies</option><option value="Load">Load / Data</option>
            <option value="Entertainment">Entertainment</option><option value="Other">Other</option></select>
            <div id="categoryFeedback" class="invalid-feedback"></div></div>
          <div class="mb-4"><label for="note" class="form-label">Note (optional)</label>
            <textarea id="note" class="form-control" rows="2" aria-describedby="noteHelp noteFeedback"></textarea>
            <div id="noteHelp" class="form-text">Up to 120 characters.</div>
            <div id="noteFeedback" class="invalid-feedback"></div></div>
          <div class="d-flex gap-2"><button type="submit" class="btn btn-primary btn-lg">Save expense</button>
            <a class="btn btn-outline-secondary btn-lg" href="transactions.html">View transactions</a></div>
        </form>
      </div>
    </div>
  </main>

  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastHolder"></div>

  <footer class="g-footer">
    <div class="container d-flex flex-column flex-sm-row justify-content-between gap-2">
      <span>&copy; <span id="year">2026</span> Gastos &mdash; CC211 Finals Laboratory Exam</span>
      <span>Frontend demonstration. Data is saved only in this browser.</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/script.js"></script>
</body>
</html>
